[profile.default]
# The conduit was compiled with 0.8.26/cancun; this contract shares nothing with it but two selectors,
# so it tracks the current release instead, as relay-fee-skim does.
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 1_000_000
# claimSwapAndDistribute decodes six dynamic arrays and three words; the legacy codegen runs out of stack on that
# signature (the conduit was built via-IR for the same reason).
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
# The vendored conduit imports OpenZeppelin and Hydrex interfaces that are not part of this repo; Selectors.t.sol
# checks it as text. The vendored Safe files are self-contained and compile.
skip = ["test/upstream/hydrex/KlimaVeTokenConduit.sol"]
fs_permissions = [
  { access = "read", path = "./test/upstream" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./verification" },
]

[profile.ci.fuzz]
runs = 10_000

[fmt]
ignore = ["./test/upstream/**/*.sol", "lib/**"]

[lint]
ignore = ["test/upstream/**/*.sol"]
exclude_lints = [
  # src/KlimaConduitExecutor.sol
  # inline assembly: re-raising the conduit's revert data needs `revert(ptr, len)`
  "inline-assembly",

  # tests and scripts
  # a narrowing cast: bytes4(keccak256(signature)) is how a selector is defined
  "unsafe-typecast",
  # ignored return values: calls under vm.expectRevert have none worth reading
  "unused-return",
  # readFile, writeJson, etch, createSelectFork: the point of the hashes script, the deploy and fork tests
  "unsafe-cheatcode",
  # repeated literals: test values read better than named constants
  "literal-instead-of-constant",
  # a raw .call: the mocks and the ETH-rejection test need one
  "low-level-calls",
  # locals without an initializer: loop flags and counters rely on zero defaults
  "uninitialized-local",
  # external calls inside a loop: assertions over the three voted pools
  "calls-loop",
  # events emitted after external calls: vm.expectEmit declarations and the mock Safe's outcome events
  "reentrancy-events",
  # ETH sent to a test-chosen destination: the ETH-rejection tests and the mock Safe's `call{value}`
  "arbitrary-send-eth",

  # test/mocks
  # several contracts per file, mocks not inheriting the interfaces they mimic
  "multi-contract-file",
  "missing-inheritance",
  # payable functions with no withdrawal, an empty function body, unchecked addresses
  "locked-ether",
  "empty-block",
  "missing-zero-check",
  # the mock Safe mirrors ModuleManager: delegatecall to a caller-chosen target, `return (false, "")`
  "controlled-delegatecall",
  "boolean-cst",
  # `lastSender` is a recorder, not an access-control variable
  "missing-events-access-control",
]
